name: Swarmaa
options:
  deploymentTarget:
    iOS: '18.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: B4F73U5RGR
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    # The worker is already sandboxed; nested Swift macro sandboxes cannot launch here.
    OTHER_SWIFT_FLAGS[sdk=iphonesimulator*]: "$(inherited) -disable-sandbox"
targets:
  Swarmaa:
    type: application
    platform: iOS
    sources:
      - Sources
      - WatchShared
      - Resources
      - path: ../Mac-app/Sources/Providers/SwarmaRelayTransport.swift
      - path: ../Mac-app/Sources/Teams/ChatMedia.swift
    dependencies:
      - target: SwarmaaWatch
        embed: true
    entitlements:
      path: Swarmaa.entitlements
      properties:
        aps-environment: development
    info:
      path: Info.plist
      properties:
        NSMicrophoneUsageDescription: Dictate messages to your bots.
        UIFileSharingEnabled: YES
        LSSupportsOpeningDocumentsInPlace: YES
        NSSpeechRecognitionUsageDescription: Turn speech into an editable message.
        NSCameraUsageDescription: Take photos to send to your bots in chat.
        CFBundleURLTypes:
          - CFBundleURLName: app.swarmaa.ios.pair
            CFBundleURLSchemes: [swarmaa]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swarmaa.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_CFBundleDisplayName: Swarmaa
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        # iPhone stays portrait; iPad turns every way and runs in Split View / Stage Manager (no UIRequiresFullScreen).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '6'
  SwarmaaWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - WatchShared
    info:
      path: Watch/Info.plist
      properties:
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swarmaa.ios.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '4'
        INFOPLIST_KEY_CFBundleDisplayName: Swarmaa
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.swarmaa.ios
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record voice memos on your Watch.
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '6'
  SwarmaaTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: Swarmaa
    sources:
      - Tests
      - path: Sources/AppCore.swift
      - path: ../Mac-app/Sources/Providers/SwarmaRelayTransport.swift
      - path: ../Mac-app/Sources/Teams/ChatMedia.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swarmaa.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Swarmaa.app/Swarmaa"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RelayCompatibilityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Mac-app/Sources/Providers/SwarmaRelayTransport.swift
      - path: ../Mac-app/Tests/SwarmaRelayTransportTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swarmaa.ios.relay-tests
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: targeted
  SwarmaaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Swarmaa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swarmaa.ios.ui-tests
        TEST_TARGET_NAME: Swarmaa
schemes:
  Swarmaa:
    build:
      targets:
        Swarmaa: all
        SwarmaaTests: [test]
        RelayCompatibilityTests: [test]
        SwarmaaUITests: [test]
    test:
      targets: [SwarmaaTests, RelayCompatibilityTests, SwarmaaUITests]
      gatherCoverageData: false
  SwarmaaWatch:
    build:
      targets:
        SwarmaaWatch: all
