name: Swarmaa
options:
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: B4F73U5RGR
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    # The worker is already sandboxed; nested Swift macro sandboxes cannot launch here.
    OTHER_SWIFT_FLAGS[sdk=iphonesimulator*]: "$(inherited) -disable-sandbox"
targets:
  Swarmaa:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - path: ../Mac-app/Sources/Providers/SwarmaRelayTransport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swarmaa.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_CFBundleDisplayName: Swarmaa
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
  SwarmaaTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: Swarmaa
    sources:
      - Tests
      - path: Sources/AppCore.swift
      - path: ../Mac-app/Sources/Providers/SwarmaRelayTransport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swarmaa.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Swarmaa.app/Swarmaa"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RelayCompatibilityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Mac-app/Sources/Providers/SwarmaRelayTransport.swift
      - path: ../Mac-app/Tests/SwarmaRelayTransportTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swarmaa.ios.relay-tests
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: targeted
  SwarmaaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Swarmaa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swarmaa.ios.ui-tests
        TEST_TARGET_NAME: Swarmaa
schemes:
  Swarmaa:
    build:
      targets:
        Swarmaa: all
        SwarmaaTests: [test]
        RelayCompatibilityTests: [test]
        SwarmaaUITests: [test]
    test:
      targets: [SwarmaaTests, RelayCompatibilityTests, SwarmaaUITests]
      gatherCoverageData: false
