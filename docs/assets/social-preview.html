<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swarmaa social preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 640px; }
    body {
      display: grid; place-items: center; color: #f2f5fa;
      background: radial-gradient(70% 90% at 80% 10%, rgba(76, 141, 255, 0.22), transparent 60%), #0a1830;
    }
    main { display: flex; align-items: center; gap: 64px; }
    img { display: block; width: 300px; height: 300px; filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.55)); }
    .word { margin: 0; font: 800 34px/1 "Archivo", sans-serif; font-stretch: 125%; letter-spacing: 0.22em; color: #f2f5fa; }
    h1 { margin: 22px 0 0; font: 700 84px/0.98 "Archivo", sans-serif; letter-spacing: -0.03em; }
    h1 span { display: block; color: #8fb8ff; }
    p { margin: 28px 0 0; color: #a3b3ca; font: 500 21px/1.5 "IBM Plex Mono", monospace; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <img src="swarmaa-mark-still.svg" alt="Swarmaa Hub icon">
    <div>
      <p class="word">SWARMAA</p>
      <h1>Your AI crew,<span>in one thread.</span></h1>
      <p>Claude Code · Codex · Antigravity — one crew on your Mac</p>
    </div>
  </main>
</body>
</html>
