<template>

  <div id="root" data-composition-id="s4-quota" data-width="1920" data-height="1080" data-layout-allow-overlap>
    <h1 id="s4-title"><span class="w">Near</span> <span class="w">a</span> <span class="w">limit?</span><br><span class="w hl">Auto-</span><br><span class="w hl">rerouted.</span></h1>

    <div id="s4-lane-gemini" class="s4-lane" style="top:80px"><div class="s4-char" data-c="#CBA8FF"></div><div class="s4-name">gemini</div><div class="s4-slots">free slots 9</div><div class="s4-chip">UI</div><div class="s4-lbl">5-hour</div><div class="s4-track"><div class="s4-fill" id="s4-f-gemini" style="background:#CBA8FF"></div><div class="s4-tick"></div></div><div class="s4-pct" id="s4-p-gemini">0%</div></div>
    <div id="s4-lane-claude" class="s4-lane" style="top:310px"><div class="s4-char" data-c="#FF5A3C" data-d="1"></div><div class="s4-name">claude</div><div class="s4-slots">free slots 9</div><div class="s4-chip">tests</div><div class="s4-lbl">5-hour</div><div class="s4-track"><div class="s4-fill" id="s4-f-claude" style="background:#FF5A3C"></div><div class="s4-tick" id="s4-tick-claude"></div></div><div class="s4-pct" id="s4-p-claude">0%</div></div>
    <div id="s4-lane-codex" class="s4-lane" style="top:540px"><div class="s4-char" data-c="#D4FF3A"></div><div class="s4-name">codex</div><div class="s4-slots">free slots 9</div><div class="s4-chip">API</div><div class="s4-lbl">5-hour</div><div class="s4-track"><div class="s4-fill" id="s4-f-codex" style="background:#D4FF3A"></div><div class="s4-tick"></div></div><div class="s4-pct" id="s4-p-codex">0%</div></div>

    <div id="s4-reason">claude: 5-hour 92% ≥ 90% limit → codex</div>

  <script>
    // Agent character: rounded body, two ink oval eyes, no mouth.
    document.querySelectorAll(".s4-char").forEach((el) => {
      const body = el.dataset.d
        ? '<rect x="50" y="50" width="100" height="100" rx="26" transform="rotate(45 100 100)"'
        : '<rect x="22" y="22" width="156" height="156" rx="46"';
      el.innerHTML = '<svg viewBox="0 0 200 200" width="130" height="130">' + body + ' fill="' + el.dataset.c + '" stroke="#000" stroke-width="10"/><ellipse class="eye" cx="76" cy="100" rx="12" ry="17" fill="#15111F"/><ellipse class="eye" cx="124" cy="100" rx="12" ry="17" fill="#15111F"/></svg>';
    });
    const eyes = (lane) => "#s4-lane-" + lane + " .eye";
    const tl = gsap.timeline({ paused: true });

    // Title: per word blur-in, then dead still.
    tl.fromTo("#s4-title .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power2.out" }, 0.35);

    // Whip in of the docked chips (the cut from s3).
    tl.fromTo(".s4-lane .s4-chip", { x: 60, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.04, ease: "power3.out" }, 0.0);

    // Quota bars climb.
    const bars = { gemini: [41, 0.7], codex: [38, 0.9], grok: [52, 1.1], claude: [92, 1.0] };
    Object.keys(bars).forEach((k) => {
      const [v, t0] = bars[k];
      const dur = k === "claude" ? 1.0 : 0.7;
      tl.fromTo("#s4-f-" + k, { scaleX: 0 }, { scaleX: v / 100, duration: dur, ease: "power2.out" }, t0);
      const o = { n: 0 };
      tl.fromTo(o, { n: 0 }, { n: v, duration: dur, ease: "power2.out", onUpdate: () => { document.getElementById("s4-p-" + k).textContent = Math.round(o.n) + "%"; } }, t0);
    });
    // Claude crosses the ceiling: tick turns flame, eyes widen, lane dims.
    tl.to("#s4-tick-claude", { backgroundColor: "#FF5A3C", scaleY: 1.25, duration: 0.15, ease: "back.out(1.6)" }, 2.0);
    tl.to(eyes("claude"), { scaleY: 1.3, scaleX: 1.25, duration: 0.15, ease: "back.out(1.6)" }, 2.0);
    tl.to("#s4-p-claude", { color: "#FF5A3C", duration: 0.1, ease: "none" }, 2.0);
    tl.to("#s4-lane-claude", { opacity: 0.4, duration: 0.3, ease: "power2.inOut" }, 2.1);

    // Blinks and glances.
    ["gemini", "codex", "grok"].forEach((k, i) => tl.to(eyes(k), { scaleY: 0.1, duration: 0.05, ease: "power2.inOut", yoyo: true, repeat: 1 }, 1.6 + i * 0.25));
    ["gemini", "claude", "codex", "grok"].forEach((k) => tl.to(eyes(k), { x: -5, duration: 0.15, ease: "power2.out" }, 0.9));

    // New task card whips in from the left, stops at Claude, then bends away to Codex (breakdown, scene 4.1 s).
    tl.fromTo("#s4-card", { x: -1800, y: 4, scale: 1.5, opacity: 0, filter: "blur(10px)" }, { x: -1491, y: 4, scale: 1.5, opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 2.75);
    tl.to("#s4-card", { x: -971, y: -146, duration: 0.7, ease: "power2.inOut" }, 3.0);
    tl.to(eyes("claude"), { x: -8, duration: 0.2, ease: "power2.out" }, 3.4);
    tl.to("#s4-lane-claude", { x: 8, duration: 0.06, ease: "power2.out", yoyo: true, repeat: 3 }, 3.8);
    tl.to("#s4-card", { x: 0, duration: 0.7, ease: "power2.inOut" }, 4.1);
    tl.to("#s4-card", { y: 0, duration: 0.7, ease: "power3.out" }, 4.1);
    tl.to("#s4-card", { scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 4.1);
    tl.to(eyes("codex"), { x: 6, duration: 0.2, ease: "power2.out" }, 4.1);
    tl.to("#s4-lane-codex", { scaleX: 1.015, scaleY: 0.97, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, 4.8);

    // Mono reason line types on.
    tl.fromTo("#s4-reason", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "steps(39)" }, 3.45);

    // The lime card that just docked on Codex grows into the next world.
    tl.set("#s4-flood", { opacity: 1 }, 5.5);
    tl.set("#s4-card", { opacity: 0 }, 5.5);
    tl.fromTo("#s4-flood", { scale: 1 }, { scale: 22, duration: 0.42, ease: "power3.in" }, 5.72);
    window.__timelines["s4-quota"] = tl;
  </script>
