<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" role="img" aria-label="Swarmaa">
  <!-- A shawarma spit whose spinning is the swarm: the meat turns, agent bees orbit it, passing behind and in front. -->
  <defs>
    <clipPath id="cone"><path d="M46 46 Q39 56 51 66 Q44 76 56 86 Q49 96 61 106 Q54 116 66 126 Q58 138 72 150 Q100 158 128 150 Q142 138 134 126 Q146 116 139 106 Q151 96 144 86 Q156 76 149 66 Q161 56 154 46 Z"/></clipPath>
    <pattern id="sear" width="22" height="9" patternUnits="userSpaceOnUse">
      <path d="M3 6 q5 -5 10 0" fill="none" stroke="#F0361A" stroke-width="3" stroke-linecap="round"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="22 0" dur="1.1s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="round" x1="0" x2="1">
      <stop offset="0" stop-color="#15111F" stop-opacity=".45"/>
      <stop offset=".3" stop-color="#15111F" stop-opacity="0"/>
      <stop offset=".4" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#15111F" stop-opacity=".45"/>
    </linearGradient>
    <symbol id="bee" viewBox="-10 -12 20 20" width="30" height="30" overflow="visible">
      <g fill="#FFFFFF" stroke="#15111F" stroke-width="1.6">
        <ellipse cx="-2" cy="-5" rx="3.2" ry="4.5"><animate attributeName="ry" values="4.5;1.2;4.5" dur=".14s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="2.5" cy="-5" rx="3.2" ry="4.5"><animate attributeName="ry" values="1.2;4.5;1.2" dur=".14s" repeatCount="indefinite"/></ellipse>
      </g>
      <ellipse rx="6.5" ry="4.6" fill="currentColor" stroke="#15111F" stroke-width="2"/>
      <path d="M-1 -4.2 v8.4" stroke="#15111F" stroke-width="2"/>
      <circle cx="4" cy="-1" r="1.1" fill="#15111F"/>
    </symbol>
  </defs>

  <!-- Each orbit: an ellipse traced back (top arc, left→right) then front (bottom arc, right→left).
       The back copy is drawn under the meat and shows for the first half; the front copy over it for the second. -->
  <g id="back">
    <use href="#bee" x="-15" y="-12" color="#D4FF3A"><animateMotion dur="3.2s" repeatCount="indefinite" path="M16 62 A84 12 0 0 1 184 62 A84 12 0 0 1 16 62"/><animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="3.2s" repeatCount="indefinite"/></use>
    <use href="#bee" x="-15" y="-12" color="#FFE08A"><animateMotion dur="4s" begin="-1.3s" repeatCount="indefinite" path="M20 86 A80 12 0 0 1 180 86 A80 12 0 0 1 20 86"/><animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="4s" begin="-1.3s" repeatCount="indefinite"/></use>
    <use href="#bee" x="-15" y="-12" color="#9CC8FF"><animateMotion dur="3.6s" begin="-2.4s" repeatCount="indefinite" path="M24 110 A76 11 0 0 1 176 110 A76 11 0 0 1 24 110"/><animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="3.6s" begin="-2.4s" repeatCount="indefinite"/></use>
    <use href="#bee" x="-15" y="-12" color="#D6C2FF"><animateMotion dur="4.4s" begin="-.6s" repeatCount="indefinite" path="M30 134 A70 10 0 0 1 170 134 A70 10 0 0 1 30 134"/><animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="4.4s" begin="-.6s" repeatCount="indefinite"/></use>
    <use href="#bee" x="-15" y="-12" color="#FFB8D9"><animateMotion dur="4s" begin="-3.3s" repeatCount="indefinite" path="M20 86 A80 12 0 0 1 180 86 A80 12 0 0 1 20 86"/><animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="4s" begin="-3.3s" repeatCount="indefinite"/></use>
  </g>

  <!-- spit -->
  <rect x="96.5" y="12" width="7" height="170" rx="3.5" fill="#15111F"/>
  <circle cx="100" cy="13" r="7" fill="#15111F"/>
  <path d="M58 180 h84 l-9 10 h-66 z" fill="#15111F"/>

  <!-- the meat: seared stripes slide sideways and a cylinder shade sits on top, so it reads as turning -->
  <g clip-path="url(#cone)">
    <rect x="30" y="40" width="140" height="120" fill="#FF5A3C"/>
    <rect x="30" y="40" width="140" height="120" fill="url(#sear)"/>
    <g fill="none" stroke="#15111F" stroke-width="2.5" stroke-opacity=".55">
      <path d="M30 66 Q100 74 170 66"/><path d="M30 86 Q100 94 170 86"/>
      <path d="M30 106 Q100 114 170 106"/><path d="M30 126 Q100 134 170 126"/>
    </g>
    <rect x="30" y="40" width="140" height="120" fill="url(#round)"/>
  </g>
  <path d="M46 46 Q39 56 51 66 Q44 76 56 86 Q49 96 61 106 Q54 116 66 126 Q58 138 72 150 Q100 158 128 150 Q142 138 134 126 Q146 116 139 106 Q151 96 144 86 Q156 76 149 66 Q161 56 154 46 Z" fill="none" stroke="#15111F" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="100" cy="46" rx="54" ry="7" fill="#F0361A" stroke="#15111F" stroke-width="6"/>
  <rect x="96.5" y="20" width="7" height="24" rx="3.5" fill="#15111F"/>
  <path d="M86 30 q14 -14 28 0 q-14 8 -28 0z" fill="#D4FF3A" stroke="#15111F" stroke-width="4" stroke-linejoin="round"/>

  <!-- face: eyes follow the swarm, blink now and then -->
  <g>
    <ellipse cx="84" cy="94" rx="10.5" ry="11.5" fill="#F6EFDC"><animate attributeName="ry" values="11.5;11.5;1;11.5" keyTimes="0;.93;.96;1" dur="5s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="116" cy="94" rx="10.5" ry="11.5" fill="#F6EFDC"><animate attributeName="ry" values="11.5;11.5;1;11.5" keyTimes="0;.93;.96;1" dur="5s" repeatCount="indefinite"/></ellipse>
    <g fill="#15111F">
      <animateTransform attributeName="transform" type="translate" values="-3 1;3 1;3 -1;-3 1" keyTimes="0;.45;.6;1" dur="4s" repeatCount="indefinite"/>
      <ellipse cx="84" cy="95" rx="6" ry="6.5"><animate attributeName="ry" values="6.5;6.5;.6;6.5" keyTimes="0;.93;.96;1" dur="5s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="116" cy="95" rx="6" ry="6.5"><animate attributeName="ry" values="6.5;6.5;.6;6.5" keyTimes="0;.93;.96;1" dur="5s" repeatCount="indefinite"/></ellipse>
    </g>
    <path d="M90 116 q10 8 20 0" fill="none" stroke="#15111F" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g id="front">
    <use href="#bee" transform="scale(-1 1)" x="-15" y="-12" color="#D4FF3A"><animateMotion dur="3.2s" repeatCount="indefinite" path="M16 62 A84 12 0 0 1 184 62 A84 12 0 0 1 16 62"/><animate attributeName="opacity" values="0;1" keyTimes="0;.5" calcMode="discrete" dur="3.2s" repeatCount="indefinite"/></use>
    <use href="#bee" transform="scale(-1 1)" x="-15" y="-12" color="#FFE08A"><animateMotion dur="4s" begin="-1.3s" repeatCount="indefinite" path="M20 86 A80 12 0 0 1 180 86 A80 12 0 0 1 20 86"/><animate attributeName="opacity" values="0;1" keyTimes="0;.5" calcMode="discrete" dur="4s" begin="-1.3s" repeatCount="indefinite"/></use>
    <use href="#bee" transform="scale(-1 1)" x="-15" y="-12" color="#9CC8FF"><animateMotion dur="3.6s" begin="-2.4s" repeatCount="indefinite" path="M24 110 A76 11 0 0 1 176 110 A76 11 0 0 1 24 110"/><animate attributeName="opacity" values="0;1" keyTimes="0;.5" calcMode="discrete" dur="3.6s" begin="-2.4s" repeatCount="indefinite"/></use>
    <use href="#bee" transform="scale(-1 1)" x="-15" y="-12" color="#D6C2FF"><animateMotion dur="4.4s" begin="-.6s" repeatCount="indefinite" path="M30 134 A70 10 0 0 1 170 134 A70 10 0 0 1 30 134"/><animate attributeName="opacity" values="0;1" keyTimes="0;.5" calcMode="discrete" dur="4.4s" begin="-.6s" repeatCount="indefinite"/></use>
    <use href="#bee" transform="scale(-1 1)" x="-15" y="-12" color="#FFB8D9"><animateMotion dur="4s" begin="-3.3s" repeatCount="indefinite" path="M20 86 A80 12 0 0 1 180 86 A80 12 0 0 1 20 86"/><animate attributeName="opacity" values="0;1" keyTimes="0;.5" calcMode="discrete" dur="4s" begin="-3.3s" repeatCount="indefinite"/></use>
  </g>
</svg>
