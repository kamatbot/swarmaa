<!doctype html>
<html><head><style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:transparent}
.stage{position:absolute;inset:0}
img{position:absolute}
</style></head><body><div class="stage" style="transform:translateY(-62px)">
<svg width="1024" height="1024" viewBox="0 0 1024 1024" style="position:absolute;inset:0">
  <defs>
    <linearGradient id="pita" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7D39A"/><stop offset="1" stop-color="#E9A95E"/>
    </linearGradient>
  </defs>
  <g transform="translate(512 985) scale(0.74) translate(-512 -950) rotate(-14 512 560)">
    <!-- hard shadow -->
    <!-- back of the pita, behind the filling -->
    <ellipse cx="512" cy="430" rx="230" ry="70" fill="#D9984F" stroke="#15111F" stroke-width="12"/>
  </g>
</svg>
<!-- the filling: the swarm, big enough to read on a home screen -->
<img src="moji-scout.svg" style="width:400px;left:130px;top:330px;transform:rotate(-18deg)">
<img src="moji-runner.svg" style="width:400px;left:500px;top:310px;transform:rotate(16deg)">
<img src="moji-lead.svg" style="width:450px;left:290px;top:150px;transform:rotate(-5deg)">
<svg width="1024" height="1024" viewBox="0 0 1024 1024" style="position:absolute;inset:0">
  <g transform="translate(512 985) scale(0.74) translate(-512 -950) rotate(-14 512 560)">
    <!-- lettuce frill -->
    <path d="M286 436 q30 -40 60 0 q30 -40 60 0 q30 -40 60 0 q30 -40 60 0 q30 -40 60 0 q30 -40 60 0 q30 -40 60 0 l0 40 l-420 0 Z" fill="#D4FF3A" stroke="#15111F" stroke-width="10" stroke-linejoin="round"/>
    <!-- front of the pita -->
    <path d="M290 440 C300 640 380 880 512 950 C644 880 724 640 734 440 C650 500 374 500 290 440 Z" fill="url(#pita)" stroke="#15111F" stroke-width="14" stroke-linejoin="round"/>
    <!-- grill marks -->
    <path d="M360 560 l60 -18 M455 548 l70 -10 M560 546 l66 2 M392 650 l64 -10 M498 646 l70 0 M430 740 l58 -4 M520 742 l54 4" stroke="#B9732F" stroke-width="12" stroke-linecap="round" opacity=".7"/>
    <!-- paper wrapper -->
    <path d="M338 700 C420 740 604 740 686 700 C664 800 600 905 512 950 C424 905 360 800 338 700 Z" fill="#F4EFE6" stroke="#15111F" stroke-width="14" stroke-linejoin="round"/>
    <path d="M362 760 C440 790 584 790 662 760" fill="none" stroke="#FF5A3C" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
</div></body></html>
