<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Usage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&amp;family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15111F}a:hover{color:#3A3347}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4EFE6; color: #15111F; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <header style="padding: 58px 20px 12px; display: flex; flex-direction: column; gap: 8px;">
    <a href="Main.dc.html" aria-label="Close" style="flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid #15111F; border-radius: 999px; background: #FFFFFF;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#15111F" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Stardos Stencil', serif; font-weight: 700; font-size: 56px; line-height: .92;">USAGE.</h1>
    <p style="margin: 0; font-size: 16px; color: #3A3347;">Auto work goes to the service with the most left.</p>
  </header>

  <section aria-label="Services" style="flex: 1; min-height: 0; padding: 4px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
    <sc-for list="{{services}}" as="s" hint-placeholder-count="3">
      <div style="padding: 12px 14px; background: #FFFFFF; border: 2.5px solid #15111F; border-radius: 20px; box-shadow: 4px 4px 0 #15111F; display: flex; gap: 14px; align-items: center;">
        <svg width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="{{s.ringLabel}}" style="flex: none;">
          <circle cx="36" cy="36" r="28" fill="none" stroke="#EDE6DA" stroke-width="10"></circle>
          <circle cx="36" cy="36" r="28" fill="none" stroke="{{s.color}}" stroke-width="10" stroke-dasharray="{{s.dash}}" transform="rotate(-90 36 36)"></circle>
          <circle cx="36" cy="36" r="34" fill="none" stroke="#15111F" stroke-width="2"></circle>
          <circle cx="36" cy="36" r="22" fill="none" stroke="#15111F" stroke-width="2"></circle>
          <text x="36" y="41" text-anchor="middle" style="font-family: 'Stardos Stencil', serif; font-size: 17px; font-weight: 700;" fill="#15111F">{{s.left}}</text>
        </svg>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
          <div style="display: flex; align-items: center; gap: 8px;"><strong style="font-size: 19px;">{{s.name}}</strong><span style="padding: 1px 7px; border: 2px solid #15111F; border-radius: 999px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .1em;">{{s.plan}}</span></div>
          <span style="font-size: 14px; color: #3A3347;">{{s.line1}}</span>
          <span style="font-size: 14px; color: #3A3347;">{{s.line2}}</span>
        </div>
      </div>
    </sc-for>
  </section>

  <div style="padding: 12px 16px 34px; display: flex; flex-direction: column; gap: 10px; border-top: 2.5px solid #15111F;">
    <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: .16em; color: #5A5168;">01 — AUTO ORDER, RIGHT NOW</p>
    <div style="display: flex; gap: 8px; align-items: center;">
      <span style="flex: 1; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid #15111F; border-radius: 999px; background: #B7CCE8; font-weight: 600; font-size: 15px;">1 Antigravity</span>
      <span style="flex: 1; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid #15111F; border-radius: 999px; background: #CFE08A; font-weight: 600; font-size: 15px;">2 Claude</span>
      <span style="flex: 1; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid #15111F; border-radius: 999px; background: #F4EFE6; font-weight: 600; font-size: 15px;">3 Codex</span>
    </div>
    <button type="button" style="height: 48px; border: 2.5px solid #15111F; border-radius: 999px; background: #FFFFFF; box-shadow: 4px 4px 0 #15111F; font-family: inherit; font-weight: 600; font-size: 16px; color: #15111F;">Refresh usage</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = 2 * Math.PI * 28;
    const svc = (name, plan, left, color, line1, line2) => ({
      name, plan, color, line1, line2, left: left + '%', ringLabel: name + ', ' + left + ' percent left',
      dash: (c * left / 100).toFixed(1) + ' ' + c.toFixed(1)
    });
    return {
      services: [
        svc('Antigravity', 'PRO', 79, '#B7CCE8', 'Session · 5 h: 12% used, resets in 4 h', 'Week: 21% used, resets Sat'),
        svc('Claude', 'MAX', 61, '#CFE08A', 'Session · 5 h: 39% used, resets in 35 min', 'Week: 18% used, resets Sun'),
        svc('Codex', 'PROLITE', 11, '#E8836B', 'Week: 89% used, resets Sun', 'Least left, so auto work tries it last')
      ]
    };
  }
}
</script>
</body>
</html>
