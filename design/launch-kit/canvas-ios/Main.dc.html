    <span style="font-size: 15px; color: #3A3347;">2 need you</span>

  <section aria-label="Bots" style="flex: 1; min-height: 0; padding: 0 16px 110px; display: flex; flex-direction: column; overflow: hidden; border-top: 2.5px solid #15111F;">
    <sc-for list="{{bots}}" as="b" hint-placeholder-count="6">
      <a href="Thread.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 2px solid #E4DCCD; text-decoration: none; color: #15111F;">
        <img src="{{b.img}}" alt="" style="width: 46px; height: 46px; flex: none;">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="display: flex; align-items: baseline; gap: 8px;">
            <span style="flex: 1; font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{b.name}}</span>
            <span style="flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5A5168;">{{b.when}}</span>
          </span>
          <span style="display: flex; align-items: center; gap: 8px;">
            <span style="flex: 1; font-size: 15px; color: #3A3347; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{b.line}}</span>
            <sc-if value="{{b.badge}}" hint-placeholder-val="{{false}}">
              <span style="flex: none; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border: 2px solid #15111F; border-radius: 999px; background: {{b.badgeColor}}; display: inline-flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;">{{b.badgeText}}</span>
            </sc-if>
          </span>
        </span>

    </sc-for>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 30px; display: flex; gap: 10px; align-items: center; background: linear-gradient(to bottom, rgba(244,239,230,0), #F4EFE6 30%);">
    <label style="flex: 1; height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 18px; box-sizing: border-box; border: 2.5px solid #15111F; border-radius: 999px; background: #FFFFFF; box-shadow: 4px 4px 0 #15111F;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15111F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search bots</span>
      <input type="search" placeholder="Search bots" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 17px; color: #15111F;">
    </label>
    <a href="Thread.dc.html" aria-label="Assistant, your starred bot, needs you" style="flex: none; position: relative; width: 54px; height: 54px; display: inline-flex; align-items: center; justify-content: center; border: 2.5px solid #15111F; border-radius: 999px; background: #FFFFFF; box-shadow: 4px 4px 0 #15111F;">
      <img src="/_blob/5bf63c436893591ac5a5f737f776dea7" alt="" style="width: 44px; height: 44px;">
      <span aria-hidden="true" style="position: absolute; left: -5px; bottom: -5px; width: 22px; height: 22px; box-sizing: border-box; border: 2px solid #15111F; border-radius: 999px; background: #EAD9A6; display: inline-flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="#15111F" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"></path></svg></span>
      <span aria-hidden="true" style="position: absolute; top: -3px; right: -3px; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #15111F; border-radius: 999px; background: #E8836B;"></span></a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const b = (name, img, when, line, badge) => ({
      name, img, when, line,
      badge: !!badge, badgeText: badge === 'needs' ? '!' : String(badge || ''),
      badgeColor: badge === 'needs' ? '#E8836B' : '#CFE08A'
    });
    return {
      bots: [
        b('Assistant ★', '/_blob/5bf63c436893591ac5a5f737f776dea7', '2:31 PM', 'Which channels should the launch use?', 'needs'),
        b('Competitor watch', '/_blob/a11264d77dce4bae147ceeba225dba7d', '2:17 PM', 'Failed: Codex quota. Retry routes to Claude.', 'needs'),

        b('Release notes', '/_blob/bbf53da0eed4f38a340239902c85441e', 'Yesterday', 'Drafted notes for 1.26.0', 0),
        b('Signals', '/_blob/ef0ba092822e0809768061dbf5e6fa6c', 'Yesterday', 'Mentions of agent teams are up this week', 0),
        b('Records', '/_blob/4b81f4287887443ab9e121c08f796fbb', 'Thursday', 'Filed 12 receipts into the tax folder', 0),
        b('Launch', '/_blob/dd3060eb199f24c4b32c42d7dde92c71', 'Oct 19', 'Paused the daily drafts until you say go', 0)
      ]
    };
  }
}
</script>
